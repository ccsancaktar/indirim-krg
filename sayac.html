<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Son 7 Gün — Köroğlu AVM</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; padding: 32px 18px; background: #090909; color: #fff; font-family: Arial, sans-serif; }
      main { width: min(760px, 100%); margin: 0 auto; }
      h1 { margin: 0 0 8px; font-size: clamp(28px, 5vw, 44px); }
      p { margin: 0 0 28px; color: #999; }
      .table { overflow: hidden; border: 1px solid #292929; border-radius: 14px; }
      .row { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 12px; padding: 17px 20px; border-bottom: 1px solid #242424; }
      .row:last-child { border-bottom: 0; }
      .head { background: #171717; color: #aaa; font-size: 12px; font-weight: bold; text-transform: uppercase; }
      .number { font-weight: 700; font-variant-numeric: tabular-nums; }
      .error { color: #ff7777; }
      @media (max-width: 480px) { .row { padding: 15px 13px; font-size: 14px; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Son 7 gün</h1>
      <p id="description">Katalog ziyaret istatistikleri</p>
      <div class="table" id="table">
        <div class="row head"><span>Tarih</span><span>Toplam giriş</span><span>Tekil ziyaretçi</span></div>
        <div class="row"><span>Yükleniyor…</span></div>
      </div>
    </main>
    <script>
      const formatter = new Intl.DateTimeFormat("tr-TR", { day: "2-digit", month: "long", year: "numeric" });
      const section = window.location.pathname.split("/")[1];
      const settings = {
        pesin: ["/api/pesin-sayac", "Peşin kataloğu ziyaret istatistikleri"],
        pesinfiyat: ["/api/pesinfiyat-sayac", "Peşin fiyat kataloğu ziyaret istatistikleri"],
      };
      const [endpoint, description] = settings[section] || ["/api/sayac", "Katalog ziyaret istatistikleri"];
      document.querySelector("#description").textContent = description;

      fetch(endpoint)
        .then((response) => {
          if (!response.ok) throw new Error("Veriler alınamadı");
          return response.json();
        })
        .then((days) => {
          document.querySelector("#table").innerHTML = `
            <div class="row head"><span>Tarih</span><span>Toplam giriş</span><span>Tekil ziyaretçi</span></div>
            ${days.map((day) => `
              <div class="row">
                <span>${formatter.format(new Date(`${day.date}T12:00:00`))}</span>
                <span class="number">${day.total}</span>
                <span class="number">${day.unique_visitors}</span>
              </div>
            `).join("")}
          `;
        })
        .catch(() => {
          document.querySelector("#table").innerHTML = '<div class="row error"><span>Sayaç verileri şu anda alınamıyor.</span></div>';
        });
    </script>
  </body>
</html>
